
# =================================
# MySQL Configuration
# =================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/moneymanager}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# =================================
# Server Configuration
# =================================
server.servlet.context-path=/api/v1.0

# =================================
# JPA Configuration
# =================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# =================================
# Brevo HTTPS API Configuration
# =================================
brevo.api.url=https://api.brevo.com/v3/smtp/email
brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=anishdevan2004@gmail.com
brevo.sender.name=Money Manager Pro

# =================================
# JWT Configuration
# =================================
jwt.secret=${JWT_SECRET}

# =================================
# Frontend and Backend URLs
# =================================
money.manager.frontend.url=${MONEY_MANAGER_FRONTEND_URL:http://localhost:5173}
app.activation.url=${MONEY_MANAGER_BACKEND_URL:http://localhost:8080}
